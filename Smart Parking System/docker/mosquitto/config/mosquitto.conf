# =============================================================================
# Eclipse Mosquitto 2 - MQTT Broker Configuration
# Smart Parking System
# =============================================================================
# Two listeners:
#   - Port 1883: Internal (no TLS) - for backend service within Docker network
#   - Port 8883: External (TLS + mTLS) - for IoT devices (ESP32, Raspberry Pi)
# =============================================================================

# --- General Settings ---
# (allow_anonymous is defined per-listener below)

# --- Persistence ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# --- Logging ---
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
connection_messages true

# --- ACL (Access Control List) ---
acl_file /mosquitto/config/acl

# =============================================================================
# Listener 1: Internal (Port 1883) - Backend Service Only
# =============================================================================
# This listener is accessible only within the Docker backend network.
# No TLS required since traffic stays within the internal network.
# The backend authenticates via its client_id.
listener 1883 0.0.0.0
allow_anonymous true

# =============================================================================
# Listener 2: External (Port 8883) - IoT Devices with mTLS
# =============================================================================
# Full mutual TLS authentication for ESP32 and Raspberry Pi devices.
# Each device must present a valid client certificate signed by our CA.
# The CN (Common Name) from the certificate is used as the MQTT username.
listener 8883 0.0.0.0
allow_anonymous false

# --- TLS Configuration ---
cafile /mosquitto/certs/ca/ca.crt
certfile /mosquitto/certs/broker/broker.crt
keyfile /mosquitto/certs/broker/broker.key

# Require client certificate (mutual TLS / mTLS)
require_certificate true

# Use certificate CN as MQTT username (for ACL matching)
use_identity_as_username true

# TLS version constraints - only allow TLS 1.2+
tls_version tlsv1.2

# --- Connection Limits ---
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# --- Keep Alive ---
max_keepalive 120

# --- Message Size Limit (256KB) ---
message_size_limit 262144
