# =============================================================================
# Smart Parking System - Nginx Configuration
# =============================================================================
# Features:
#   - HTTP → HTTPS redirect
#   - TLS termination with security headers
#   - Reverse proxy to Spring Boot backend
#   - WebSocket support for /ws endpoint
#   - Rate limiting (100 req/min per IP)
#   - CORS headers
#   - Gzip compression
#   - Static file serving for web app
# =============================================================================

# Worker configuration
worker_processes auto;
worker_rlimit_nofile 8192;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # --- Basic Settings ---
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # --- Performance ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;  # Hide Nginx version

    # --- File Upload Limit ---
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # --- Rate Limiting ---
    # 100 requests per minute per IP for API endpoints
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Stricter rate limit for authentication endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # General rate limit
    limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;

    # Rate limit response code
    limit_req_status 429;

    # --- Upstream Backend ---
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # =========================================================================
    # HTTP Server - Redirect to HTTPS
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint (for Docker healthcheck via HTTP)
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS Server - Main Application
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # --- SSL Configuration ---
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS protocols and ciphers (modern configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # SSL session caching
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (if using real certificates)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # --- Security Headers ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:;" always;

        # --- CORS Headers (handled here for preflight) ---
        # For complex CORS, the backend should handle it.
        # This handles preflight OPTIONS requests at the proxy level.

        # --- Static Files (Web App) ---
        root /usr/share/nginx/html;
        index index.html;

        # --- API Proxy ---
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            # CORS headers for API
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, X-Nonce, X-Timestamp' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # CORS response headers
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # --- Authentication endpoints (stricter rate limit) ---
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        # --- WebSocket Proxy ---
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeout (keep connection open)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Swagger UI (development only - disable in production) ---
        location /swagger-ui/ {
            limit_req zone=general burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- OpenAPI Docs ---
        location /v3/api-docs/ {
            limit_req zone=general burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Actuator (restrict to health only) ---
        location /actuator/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # Block all other actuator endpoints
        location /actuator/ {
            return 403;
        }

        # --- SPA Routing (Vue/React/Angular) ---
        # For single-page applications, serve index.html for unknown routes
        location / {
            limit_req zone=general burst=30 nodelay;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # --- Block sensitive files ---
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~ ~$ {
            deny all;
            return 404;
        }
    }
}
