version: '3.9'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mock-mosquitto
    ports:
      - "1883:1883"
    command: sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    networks:
      - mock-net

  camera:
    build:
      context: ./iot/anpr-camera
    container_name: mock-camera
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USE_TLS=False
      - MQTT_TOPIC_EVENT=parking/gates/gate1/event
      - GATE_ID=gate1
    depends_on:
      - mosquitto
    networks:
      - mock-net

  qr-scanner:
    build:
      context: ./iot/qr-scanner
    container_name: mock-qr-scanner
    ports:
      - "8001:8001"
    environment:
      - SERVER_URL=http://localhost:8080 # Points to the external server other teammates will build
      - CAMERA_URL=http://camera:8000
      - GATE_ID=gate1
    depends_on:
      - camera
    networks:
      - mock-net

  node-red:
    image: nodered/node-red:latest
    container_name: mock-dashboard
    ports:
      - "1880:1880"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./docker/node-red/flows.json:/data/flows.json
      - ./docker/node-red/package.json:/data/package.json
    depends_on:
      - mosquitto
      - qr-scanner
    networks:
      - mock-net

networks:
  mock-net:
    driver: bridge
