; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Workaround for Windows MAX_PATH limit: move ONLY libdeps directory to a shorter path
libdeps_dir = ${sysenv.HOME}/.pio_libdeps

; ======================================================================
; COMMON SETTINGS (shared between all environments)
; ======================================================================
[env_common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

; ======================================================================
; ENVIRONMENT 1: WOKWI SIMULATION (default — uses HiveMQ public broker)
; ======================================================================
; Build command : pio run -e wokwi
; Wokwi loads  : .pio/build/wokwi/firmware.elf
[env:wokwi]
extends = env_common
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
    ; NO -D PRODUCTION_MODE  → code picks dev/HiveMQ path automatically

; ======================================================================
; ENVIRONMENT 2: PRODUCTION (flashing to real ESP32 hardware)
; ======================================================================
; Build command : pio run -e production
; Flash command : pio run -e production --target upload
; BEFORE USING: fill in REAL_WIFI_SSID, REAL_WIFI_PASSWORD,
;               MQTT_BROKER_IP, and place cert files under src/certs/
[env:production]
extends = env_common
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
    -D PRODUCTION_MODE
    ; Override WiFi credentials for production — change these values!
    -D REAL_WIFI_SSID=\"YOUR_WIFI_SSID\"
    -D REAL_WIFI_PASSWORD=\"YOUR_WIFI_PASSWORD\"
    ; Override MQTT broker — change to your Docker host IP
    -D REAL_MQTT_HOST=\"192.168.1.100\"
    ; mTLS port
    -D REAL_MQTT_PORT=8883
